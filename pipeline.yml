# Forge CI/CD pipeline — Qiu-Technologies/posthog (fork).
#
# This fork owns the self-hosted PostHog (hobby) deployment. Upstream
# application code is not built here — the target host pulls upstream images;
# the pipeline ships our deploy config + secrets and drives `docker compose`
# on the target (deploy/scripts/deploy-box.sh).
#
# The target host is selected runner-side (~/.config/posthog-deploy/env, not
# in this public repo): currently stevenspc (local). See deploy/README.md.
#
# build:      validate the compose files merge (host step — docker lives on
#             the runner host, not the sandbox).
# production: deploy-box.sh — vault env → target, sparse-clone the fork on the
#             target at this SHA, compose pull + up -d (background, with the
#             trim overlay), then poll the proxy until the web app answers.
#             The health_check is host-only: the public hostname keeps serving
#             the previous origin until the ingress cutover.
#
# Secrets: none in Forge. The deploy reads the vault (pass) on the runner host.
stages:
  build:
    runs-on: local
    container: node:24
    skip_paths:
      - "deploy/README.md"
    steps:
      - name: Placeholder (validation runs on the host)
        run: echo "compose validation runs on the host step"
      - name: Validate compose files
        host: true
        run: |
          cd deploy
          # env_file target — stubbed for validation only (real one is vaulted)
          touch .env.services
          trap 'rm -f .env.services' EXIT
          docker compose -f docker-compose.yml -f docker-compose.trim.yml config -q 2>/dev/null \
            && echo "✓ compose config valid (with trim overlay)"

  production:
    runs-on: local
    needs: [build]
    container: node:24
    steps:
      - name: Placeholder (deploy runs on the host)
        run: echo "deploy runs on the host step"
      - name: Deploy the hobby stack to the target host
        host: true
        run: bash deploy/scripts/deploy-box.sh
    bake: 60s
    health_check:
      interval: 15s
      run: |
        # Host serving path only — the public hostname is cut over separately.
        # 100 x 15s = 25 min: a recreate on a new app image re-runs migrations
        # (incl. async) and can exceed 20 minutes under load.
        [ -f "$HOME/.config/posthog-deploy/env" ] && . "$HOME/.config/posthog-deploy/env"
        HEALTH_URL="${HEALTH_URL:-http://127.0.0.1:18080/}"
        for i in $(seq 1 100); do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$HEALTH_URL" 2>/dev/null || echo 000)
          case "$CODE" in
            200|302) echo "✓ posthog web serving (http $CODE)"; exit 0 ;;
          esac
          sleep 15
        done
        echo "✗ posthog web did not come up (last http: $CODE)"
        exit 1